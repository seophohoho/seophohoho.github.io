---
layout: default
---

<article class="wrapper post-detail">
  <header class="post-header">
    <div class="meta">
      <time>{{ page.date | date: "%b %d, %Y" }}</time>
      <span class="dot"></span>
      <span>
        {% capture words %}{{ content | number_of_words }}{% endcapture %}
        {{ words | divided_by: 180 | plus: 1 }} min read
      </span>
    </div>

    <h1 class="post-title-main">
      {{ page.title }}
    </h1>

    <h2 class="post-subtitle-main">
      {{ page.sub-title }}
    </h2>

    <div class="tag-row">
      {% for tag in page.tags %}
        <span class="tag gray">#{{ tag }}</span>
      {% endfor %}
    </div>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
